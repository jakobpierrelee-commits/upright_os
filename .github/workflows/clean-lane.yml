name: clean-lane

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_clean_gates:
        description: "Run live codex/bridge gates (requires runner env + codex login)"
        required: false
        default: "0"

jobs:
  clean-lane:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Run clean lane CI script
        env:
          RUN_LIVE_CLEAN_GATES: ${{ github.event.inputs.run_live_clean_gates || '0' }}
        run: |
          chmod +x tools/lean/ci_clean_lane.sh
          ./tools/lean/ci_clean_lane.sh
